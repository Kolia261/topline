<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#1a237e"/>
  <rect x="20" y="20" width="360" height="260" rx="8" fill="#283593"/>
  <!-- Bed icon -->
  <rect x="130" y="120" width="140" height="60" rx="6" fill="#5c6bc0"/>
  <rect x="130" y="100" width="140" height="30" rx="4" fill="#7986cb"/>
  <rect x="120" y="170" width="10" height="20" rx="2" fill="#5c6bc0"/>
  <rect x="270" y="170" width="10" height="20" rx="2" fill="#5c6bc0"/>
  <!-- Lamp -->
  <rect x="190" y="70" width="20" height="30" rx="3" fill="#ffd54f"/>
  <rect x="185" y="65" width="30" height="8" rx="4" fill="#ffecb3"/>
  <!-- Night stands -->
  <rect x="95" y="140" width="30" height="30" rx="3" fill="#3f51b5"/>
  <rect x="275" y="140" width="30" height="30" rx="3" fill="#3f51b5"/>
  <!-- Floor line -->
  <line x1="40" y1="200" x2="360" y2="200" stroke="#5c6bc0" stroke-width="1" opacity="0.5"/>
  <!-- Text -->
  <text x="200" y="240" text-anchor="middle" fill="#9fa8da" font-family="Arial,sans-serif" font-size="14" font-weight="600">Интерьер</text>
  <text x="200" y="260" text-anchor="middle" fill="#7986cb" font-family="Arial,sans-serif" font-size="11">Фото скоро будет</text>
</svg>
